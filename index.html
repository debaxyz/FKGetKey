<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register • Create Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6366f1',
            accent: '#22d3ee',
            dark: '#0f172a',
            card: '#1e293b',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(ellipse at top, #1e293b 0%, #0f172a 50%, #020617 100%);
      min-height: 100vh;
    }
    .glass {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(34, 211, 238, 0.2);
    }
    .input-glow:focus {
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.3), 0 0 20px rgba(34, 211, 238, 0.15);
    }
    .btn-glow:hover {
      box-shadow: 0 0 30px rgba(34, 211, 238, 0.35);
    }
    .device-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body class="font-sans text-slate-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md animate-fade-in">
    <!-- Logo / Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-accent to-primary mb-4 shadow-lg shadow-accent/30">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold tracking-tight">Create Account</h1>
      <p class="text-slate-400 mt-2">Register a new username</p>
    </div>

    <!-- Card -->
    <div class="glass rounded-2xl p-8 shadow-2xl">
      <form id="registerForm" class="space-y-6">
        <!-- Username -->
        <div>
          <label for="username" class="block text-sm font-medium text-slate-300 mb-2">Username</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </span>
            <input
              type="text"
              id="username"
              name="username"
              required
              autocomplete="username"
              placeholder="Choose a username"
              minlength="3"
              maxlength="32"
              class="w-full pl-10 pr-4 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-accent input-glow transition-all duration-200"
            />
          </div>
          <p class="mt-1.5 text-xs text-slate-500">3–32 characters, letters, numbers, underscores</p>
        </div>

        <!-- Device ID -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Device ID</label>
          <div class="flex items-center gap-2">
            <div id="deviceIdDisplay" class="flex-1 device-badge text-xs sm:text-sm px-4 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-accent truncate">
              Generating...
            </div>
            <button type="button" id="copyDeviceBtn" title="Copy Device ID" class="p-3 rounded-xl bg-slate-800 border border-slate-700 hover:bg-slate-700 transition-colors text-slate-300 hover:text-white">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
              </svg>
            </button>
          </div>
          <p class="mt-1.5 text-xs text-slate-500">This device will be linked to your account</p>
        </div>

        <!-- Register Button -->
        <button
          type="submit"
          id="registerBtn"
          class="w-full py-3.5 px-4 bg-gradient-to-r from-accent to-cyan-500 hover:from-cyan-400 hover:to-accent text-slate-900 font-semibold rounded-xl transition-all duration-300 btn-glow flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
        >
          <span id="btnText">Register</span>
          <svg id="btnSpinner" class="hidden w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>
      </form>

      <!-- Message area -->
      <div id="message" class="mt-4 text-center text-sm hidden"></div>

      <!-- Footer link -->
      <p class="mt-6 text-center text-sm text-slate-400">
        Already have an account?
        <a href="login.html" class="text-primary hover:text-indigo-300 font-medium transition-colors">Login</a>
      </p>
    </div>

    <p class="text-center text-xs text-slate-600 mt-8">Secure registration • Device-bound accounts</p>
  </div>

  <script>
    // ========== Sound Effects ==========
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
    }

    function playTone(freq, duration = 0.1, type = 'sine', volume = 0.15) {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playSuccess() {
      playTone(523.25, 0.08);
      setTimeout(() => playTone(659.25, 0.08), 80);
      setTimeout(() => playTone(783.99, 0.12), 160);
    }

    function playError() {
      playTone(200, 0.15, 'sawtooth', 0.12);
      setTimeout(() => playTone(150, 0.2, 'sawtooth', 0.1), 120);
    }

    function playClick() {
      playTone(800, 0.05, 'square', 0.08);
    }

    function playCopy() {
      playTone(1000, 0.06, 'sine', 0.1);
    }

    // ========== Device ID ==========
    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function getOrCreateDeviceId() {
      let id = localStorage.getItem('device_id');
      if (!id) {
        id = generateUUID();
        localStorage.setItem('device_id', id);
      }
      return id;
    }

    const deviceId = getOrCreateDeviceId();
    document.getElementById('deviceIdDisplay').textContent = deviceId;

    document.getElementById('copyDeviceBtn').addEventListener('click', () => {
      playCopy();
      navigator.clipboard.writeText(deviceId).then(() => {
        const btn = document.getElementById('copyDeviceBtn');
        btn.innerHTML = `<svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`;
        setTimeout(() => {
          btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>`;
        }, 1500);
      });
    });

    // ========== Form Handling ==========
    const form = document.getElementById('registerForm');
    const messageEl = document.getElementById('message');
    const registerBtn = document.getElementById('registerBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    function showMessage(text, type = 'error') {
      messageEl.textContent = text;
      messageEl.className = `mt-4 text-center text-sm ${type === 'success' ? 'text-green-400' : 'text-red-400'}`;
      messageEl.classList.remove('hidden');
    }

    function setLoading(loading) {
      registerBtn.disabled = loading;
      btnText.textContent = loading ? 'Creating...' : 'Register';
      btnSpinner.classList.toggle('hidden', !loading);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      playClick();
      const username = document.getElementById('username').value.trim();
      if (!username || username.length < 3) {
        playError();
        showMessage('Username must be at least 3 characters');
        return;
      }

      setLoading(true);
      messageEl.classList.add('hidden');

      try {
        const res = await fetch('https://dn-key-server-store.vercel.app/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, device_id: deviceId })
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok) {
          playSuccess();
          showMessage(data.message || 'Registration successful! You can now login.', 'success');
          // Optional redirect
          // setTimeout(() => window.location.href = 'login.html', 1500);
        } else {
          playError();
          showMessage(data.detail || data.message || 'Registration failed. Username may be taken.');
        }
      } catch (err) {
        playError();
        showMessage('Network error. Please try again.');
        console.error(err);
      } finally {
        setLoading(false);
      }
    });

    document.getElementById('username').focus();
  </script>
</body>
</html>
