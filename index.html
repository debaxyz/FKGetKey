<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at 30% 20%, #1b0e2e, #05010a 70%);
    color: #e8e6ff;
  }
  .card {
    width: 100%;
    max-width: 360px;
    padding: 32px 28px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
  }
  h1 {
    margin: 0 0 6px;
    font-size: 22px;
    text-align: center;
    background: linear-gradient(90deg, #7f5af0, #2cb67d);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.sub {
    text-align: center;
    font-size: 12px;
    color: #9a94b8;
    margin: 0 0 24px;
  }
  label {
    font-size: 12px;
    color: #b8b3d6;
    display: block;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 16px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: #7f5af0; }
  input[readonly] { color: #8a84ad; }
  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #7f5af0, #2cb67d);
    color: #05010a;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  .msg.error { color: #ff6b6b; }
  .msg.success { color: #2cb67d; }
  .link {
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
  }
  .link a { color: #7f5af0; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Sign In</h1>
    <p class="sub">Enter your username to continue</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required maxlength="32" placeholder="your_username">

      <label for="deviceId">Device ID</label>
      <input type="text" id="deviceId" readonly>

      <button type="submit" id="submitBtn">Login</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="link">No account? <a href="register.html">Register</a></div>
  </div>

<script>
  // Config: point this at your deployed API base URL
  const API_BASE = window.API_BASE || "https://dn-key-server-store.vercel.app";

  function getDeviceId() {
    let id = localStorage.getItem("device_id");
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem("device_id", id);
    }
    return id;
  }

  document.getElementById("deviceId").value = getDeviceId();

  const form = document.getElementById("loginForm");
  const msg = document.getElementById("msg");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "";
    msg.className = "msg";
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in...";

    const username = document.getElementById("username").value.trim();
    const device_id = document.getElementById("deviceId").value;

    try {
      const res = await fetch(`${API_BASE}/api/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, device_id })
      });
      const data = await res.json();

      if (!res.ok) {
        msg.textContent = data.detail || "Login failed";
        msg.classList.add("error");
      } else {
        msg.textContent = "Login successful";
        msg.classList.add("success");
        localStorage.setItem("session_token", data.session_token);
        localStorage.setItem("username", username);
        // window.location.href = "dashboard.html";
      }
    } catch (err) {
      msg.textContent = "Network error. Try again.";
      msg.classList.add("error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Login";
    }
  });
</script>
</body>
</html>
